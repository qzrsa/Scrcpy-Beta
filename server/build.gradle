plugins {
  id 'com.android.application' version '8.7.2'
}

android {
  namespace 'qzrs.Scrcpy.server'
  compileSdk 36

  defaultConfig {
    minSdk 21
    targetSdk 36
    applicationId 'qzrs.Scrcpy.server'
    // 服务端内部版本：基于 Genymobile/scrcpy v4.1 对齐（非官方发布版号，仅作谱系标记）
    versionCode 40100
    versionName '4.1.0'
  }

  buildTypes {
    release {
      ndk {
        abiFilters "arm64-v8a", "armeabi-v7a"
      }
      debuggable false
      minifyEnabled true
      shrinkResources true
      proguardFiles 'proguard-rules.pro'
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  dependenciesInfo {
    includeInApk = false
    includeInBundle = false
  }

  buildFeatures {
    aidl true
  }
}

task copyRelease(type: Copy) {
    dependsOn 'assembleRelease'
    from file('build/outputs/apk/release/server-release-unsigned.apk')
    // 输出到 server 自身 build 生成目录的 res 根下的 raw/ 子目录（app 的 res.srcDirs 引用该 res 根 serverRes/），
    // 文件落在 serverRes/raw/scrcpy_server.jar，即 app 的 res/raw/scrcpy_server（R.raw.scrcpy_server）。
    // 不要写 app 源码 res/，避免构建期修改源码导致 Gradle 输入快照冲突/隐式依赖校验失败
    into file('build/generated/serverRes/raw/')
    rename('server-release-unsigned.apk', 'scrcpy_server.jar')
}

dependencies {
}
