name: Build and Release Android App

on:
  workflow_dispatch:
    inputs:
      app_version_name:
        description: 'Version Name'
        required: true
        default: '2.0.X'
        type: string
      app_version_code:
        description: 'Version Code (0 = auto-increment)'
        required: false
        default: '0'
        type: string
      note:
        description: 'Update Note'
        required: false
        default: ''
        type: string
      prerelease:
        description: '发布预览版'
        required: false
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 项目根自适应：兼容「代码在仓库根」(Scrcpy-Beta) 与「代码在 Scrcpy/ 子目录」(主仓库) 两种结构
      - name: Detect Project Root
        id: proj
        run: |
          if [ -f "Scrcpy/app/build.gradle" ]; then
            echo "PROJ=Scrcpy" >> "$GITHUB_ENV"
          elif [ -f "app/build.gradle" ]; then
            echo "PROJ=." >> "$GITHUB_ENV"
          else
            echo "::error::app/build.gradle not found (neither Scrcpy/app nor app)"
            exit 1
          fi
          echo "Project root: $PROJ"

      - name: Install Android SDK Components
        run: |
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKM=sdkmanager
          elif [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/tools/bin/sdkmanager" ]; then
            SDKM="$ANDROID_HOME/tools/bin/sdkmanager"
          else
            echo "sdkmanager not found, relying on AGP auto-download"
            exit 0
          fi
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-36" "build-tools;35.0.0" > /dev/null 2>&1 || echo "SDK components may already be installed"
          echo "SDK ready"

      - name: Decode Keystore and Setup Properties
        run: |
          echo "MY_KEYSTORE_FILE=upload_keystore.jks" > keystore.properties
          echo "MY_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "MY_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> keystore.properties
          echo "MY_KEYSTORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> keystore.properties

          mkdir -p "$PROJ/app"
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > "$PROJ/app/upload_keystore.jks"

      - name: Update Android Version
        id: version
        run: |
          INPUT_CODE="${{ inputs.app_version_code }}"
          APP_GRADLE="$PROJ/app/build.gradle"
          if [ "$INPUT_CODE" = "0" ] || [ -z "$INPUT_CODE" ]; then
            CURRENT_CODE=$(grep -oP 'versionCode\s+\K\d+' "$APP_GRADLE" | head -1)
            NEW_CODE=$((CURRENT_CODE + 1))
          else
            NEW_CODE="$INPUT_CODE"
          fi

          sed -i "s/versionCode [0-9]\+/versionCode ${NEW_CODE}/" "$APP_GRADLE"
          sed -i "s/versionName \".*\"/versionName \"${{ inputs.app_version_name }}\"/" "$APP_GRADLE"

          echo "new_version_code=${NEW_CODE}" >> $GITHUB_OUTPUT
          echo "New versionCode=${NEW_CODE}"
          echo "New versionName=${{ inputs.app_version_name }}"

      - name: Grant execute permission for gradlew
        run: chmod +x "$PROJ/gradlew"

      - name: Build Server
        run: |
          cd "$PROJ"
          ./gradlew :server:copyRelease --no-daemon

      - name: Build App
        run: |
          cd "$PROJ"
          ./gradlew :app:assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p release
          APK_PATH=$(find "$PROJ/app/build/outputs/apk/release" -name "*.apk" | head -1)
          cp "$APK_PATH" release/Scrcpy.apk
          ls -l release

      - name: Generate Tag
        id: tag
        run: |
          echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
          echo "release_date=$(date +"%Y-%m-%d %H:%M")" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: Scrcpy Release ${{ steps.tag.outputs.release_tag }}
          body: |
            Version Name: ${{ inputs.app_version_name }}
            Version Code: ${{ steps.version.outputs.new_version_code }}
            Build Date: ${{ steps.tag.outputs.release_date }}
            Note: ${{ inputs.note }}
          draft: false
          prerelease: ${{ inputs.prerelease }}
          files: release/Scrcpy.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Version Bump
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$PROJ/app/build.gradle"
          git commit -m "chore: bump versionCode to ${{ steps.version.outputs.new_version_code }}" || echo "no changes to commit"
          git push || echo "push failed, version bump not persisted"
