plugins {
  id 'com.android.application' version '8.7.2'
}

// 自适应两种仓库结构：代码在仓库根(Scrcpy-Beta) 时 keystore.properties 在 gradle 根目录；
// 代码在 Scrcpy/ 子目录(主仓库) 时在 gradle 根上一级
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (!keystorePropertiesFile.exists()) {
    keystorePropertiesFile = rootProject.file('../keystore.properties')
}
def keystoreProperties = new Properties()
def hasKeystore = false
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    def ksFile = keystoreProperties.getProperty('MY_KEYSTORE_FILE')
    def ksAlias = keystoreProperties.getProperty('MY_KEY_ALIAS')
    def ksPass = keystoreProperties.getProperty('MY_KEYSTORE_PASSWORD')
    def keyPass = keystoreProperties.getProperty('MY_KEY_PASSWORD')
    // 仅在 keystore 文件存在且非空、且别名/密码均非空时才启用 release 签名。
    // CI 未配置签名 secrets 时会生成空占位 keystore + 空密码，此时 hasKeystore=false，
    // buildTypes.release 会回退到 signingConfigs.debug，APK 仍可被安装测试。
    // 一旦仓库配齐 SIGNING_KEY/KEY_ALIAS/KEY_PASSWORD/STORE_PASSWORD 四个 secret，则自动改为 release 签名包。
    def ksPath = (ksFile != null && !ksFile.trim().empty) ? rootProject.file(ksFile) : null
    if (ksPath != null && ksPath.exists() && ksPath.length() > 0
            && ksAlias != null && !ksAlias.trim().empty
            && ksPass != null && !ksPass.trim().empty
            && keyPass != null && !keyPass.trim().empty) {
        hasKeystore = true
    }
}

android {
  namespace 'qzrs.Scrcpy'
  compileSdk 36

  sourceSets {
    main {
      // server 模块 copyRelease 生成的 res（内置 scrcpy_server.jar → R.raw.scrcpy_server）。
      // copyRelease 输出到 server/build/generated/serverRes/（res 根目录），
      // 文件落在 serverRes/raw/scrcpy_server.jar，即 app 的 res/raw/scrcpy_server。
      // 用固定相对路径（app 与 server 在两种仓库结构下均为同级目录，'../server/...' 通用），
      // 避免跨工程 tasks.named() 在配置期查找任务失败；依赖由下方 tasks.matching 显式声明。
      res.srcDir '../server/build/generated/serverRes'
    }
  }

  defaultConfig {
    applicationId "qzrs.Scrcpy"
    minSdk 21
    targetSdk 36
    versionCode 1
    versionName "2.0.X"
    ndk {
      abiFilters "arm64-v8a", "armeabi-v7a"
    }
  }

  viewBinding {
    enabled = true
  }
  
  signingConfigs {
      release {
        if (hasKeystore) {
          storeFile file(keystoreProperties['MY_KEYSTORE_FILE'])
          storePassword keystoreProperties['MY_KEYSTORE_PASSWORD']
          keyAlias keystoreProperties['MY_KEY_ALIAS']
          keyPassword keystoreProperties['MY_KEY_PASSWORD']
        }
      }
  }

  buildTypes {
    debug {
      buildConfigField "boolean", "ENABLE_DEBUG_FEATURE", "true"
      manifestPlaceholders = [app_name: "@string/app_name_dev", app_icon: "@mipmap/ic_launcher_dev", app_icon_round: "@mipmap/ic_launcher_dev_round"]
      debuggable true
    }
    release {
      buildConfigField "boolean", "ENABLE_DEBUG_FEATURE", "false"
      manifestPlaceholders = [app_name: "@string/app_name", app_icon: "@mipmap/ic_launcher", app_icon_round: "@mipmap/ic_launcher_round"]
      debuggable false
      minifyEnabled true
      shrinkResources true
      proguardFiles 'proguard-rules.pro'
      if (hasKeystore) {
        signingConfig signingConfigs.release
      } else {
        // CI 无 release 签名 secrets 时用 debug 签名兜底，APK 可被安装；
        // 不会产出完全未签名的包导致 INSTALL_PARSE_FAILED_NO_CERTIFICATES。
        signingConfig signingConfigs.debug
      }
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  dependenciesInfo {
    includeInApk = false
    includeInBundle = false
  }

  packagingOptions {
    resources.excludes.add("META-INF/*")
  }
}

// Automatically build server before assembling the app
// Gradle 8.9 严格校验：app 在构建 release/debug 时会读取内置 server 资源
// (res/raw/scrcpy_server.jar，由 :server:copyRelease 生成到 server/build/generated/serverRes)。
// 必须以 :app 相关任务显式 dependsOn :server:copyRelease，否则 map*SourceSetPaths /
// generate*Resources / process*Resources 报“隐式依赖”错误而构建失败。
// configureEach 惰性匹配覆盖所有变体（debug/release）。
def serverCopyRelease = ':server:copyRelease'
tasks.matching {
    it.name.startsWith('map') && it.name.endsWith('SourceSetPaths') ||
    it.name.startsWith('generate') && it.name.endsWith('Resources') ||
    it.name.startsWith('process') && it.name.endsWith('Resources') ||
    it.name.startsWith('assemble')
}.configureEach {
    it.dependsOn(serverCopyRelease)
}

dependencies {
  implementation 'androidx.documentfile:documentfile:1.0.1'
}
