plugins {
  id 'com.android.application' version '8.7.2'
}

// 自适应两种仓库结构：代码在仓库根(Scrcpy-Beta) 时 keystore.properties 在 gradle 根目录；
// 代码在 Scrcpy/ 子目录(主仓库) 时在 gradle 根上一级
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (!keystorePropertiesFile.exists()) {
    keystorePropertiesFile = rootProject.file('../keystore.properties')
}
def keystoreProperties = new Properties()
def hasKeystore = false
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    hasKeystore = true
}

android {
  namespace 'qzrs.Scrcpy'
  compileSdk 36

  sourceSets {
    main {
      // server 模块 copyRelease 生成的 res（内置 scrcpy_server.jar），避免写源码目录
      res.srcDirs += file("${project(':server').buildDir}/generated/serverRes")
    }
  }

  defaultConfig {
    applicationId "qzrs.Scrcpy"
    minSdk 21
    targetSdk 36
    versionCode 1
    versionName "2.0.X"
    ndk {
      abiFilters "arm64-v8a", "armeabi-v7a"
    }
  }

  viewBinding {
    enabled = true
  }
  
  signingConfigs {
      release {
        if (hasKeystore) {
          storeFile file(keystoreProperties['MY_KEYSTORE_FILE'])
          storePassword keystoreProperties['MY_KEYSTORE_PASSWORD']
          keyAlias keystoreProperties['MY_KEY_ALIAS']
          keyPassword keystoreProperties['MY_KEY_PASSWORD']
        }
      }
  }

  buildTypes {
    debug {
      buildConfigField "boolean", "ENABLE_DEBUG_FEATURE", "true"
      manifestPlaceholders = [app_name: "@string/app_name_dev", app_icon: "@mipmap/ic_launcher_dev", app_icon_round: "@mipmap/ic_launcher_dev_round"]
      debuggable true
    }
    release {
      buildConfigField "boolean", "ENABLE_DEBUG_FEATURE", "false"
      manifestPlaceholders = [app_name: "@string/app_name", app_icon: "@mipmap/ic_launcher", app_icon_round: "@mipmap/ic_launcher_round"]
      debuggable false
      minifyEnabled true
      shrinkResources true
      proguardFiles 'proguard-rules.pro'
      if (hasKeystore) {
        signingConfig signingConfigs.release
      }
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  dependenciesInfo {
    includeInApk = false
    includeInBundle = false
  }

  packagingOptions {
    resources.excludes.add("META-INF/*")
  }
}

// Automatically build server before assembling the app
// Gradle 8.9 严格校验：generate*Resources 读取 res/raw/scrcpy_server.jar（:server:copyRelease 的输出），
// 必须显式声明依赖，否则报隐式依赖错误。matching+configureEach 惰性挂依赖，覆盖 debug/release。
tasks.matching { it.name.startsWith("generate") && it.name.endsWith("Resources") }
     .configureEach { it.dependsOn(':server:copyRelease') }
tasks.matching { it.name.startsWith("assemble") && it.name.endsWith("Release") || it.name.startsWith("assemble") && it.name.endsWith("Debug") }
     .configureEach { it.dependsOn(':server:copyRelease') }

dependencies {
  implementation 'androidx.documentfile:documentfile:1.0.1'
}
