plugins {
  id 'com.android.application' version '8.7.2'
}

android {
  namespace 'qzrs.Scrcpy.server'
  compileSdk 36

  defaultConfig {
    minSdk 21
    targetSdk 36
    applicationId 'qzrs.Scrcpy.server'
    // 服务端内部版本：基于 Genymobile/scrcpy v4.1 对齐（非官方发布版号，仅作谱系标记）
    versionCode 40100
    versionName '4.1.0'
  }

  buildTypes {
    release {
      ndk {
        abiFilters "arm64-v8a", "armeabi-v7a"
      }
      debuggable false
      minifyEnabled true
      shrinkResources true
      proguardFiles 'proguard-rules.pro'
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  dependenciesInfo {
    includeInApk = false
    includeInBundle = false
  }

  buildFeatures {
    aidl true
  }
}

task copyRelease(type: Copy) {
    dependsOn 'assembleRelease'
    from file('build/outputs/apk/release/server-release-unsigned.apk')
    into file('../app/src/main/res/raw/')
    rename('server-release-unsigned.apk', 'scrcpy_server.jar')
}

dependencies {
}
